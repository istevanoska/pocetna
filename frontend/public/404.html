<!doctype html>
<html lang="mk">
<head>
  <meta charset="utf-8">
  <title>Страницата не постои — Почетна.мк</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#e5202b">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    :root {
      --bg: #f4f5f8;
      --surface: #ffffff;
      --text: #14151f;
      --muted: #656b7a;
      --border: #e7e9ee;
      --primary: #e5202b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14151f; --surface: #1c1e2a; --text: #f2f3f7;
        --muted: #a0a6b8; --border: #2a2d3d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 36px 28px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 4px 16px rgba(20, 20, 30, 0.08);
    }
    .code {
      margin: 0;
      font-size: 56px;
      line-height: 1;
      font-weight: 800;
      color: var(--primary);
    }
    h1 { margin: 14px 0 0; font-size: 20px; font-weight: 700; }
    p { margin: 10px 0 24px; font-size: 14px; line-height: 1.55; color: var(--muted); }
    a {
      display: inline-block;
      padding: 11px 20px;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { background: #c4151f; }
  </style>
</head>
<body>
  <main class="card">
    <p class="code">404</p>
    <h1>Страницата не постои</h1>
    <p>Оваа адреса не е достапна или е преместена.</p>
    <a href="/">Врати се на почетната страница</a>
  </main>
</body>
</html>
