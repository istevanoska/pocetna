spring.application.name=pocetna
# Render (and most PaaS) inject the port via $PORT; fall back to 8080 locally.
server.port=${PORT:8080}

# Loads local secrets (Google API key + CSE id) if the file exists.
# secrets.properties is git-ignored so real keys are never committed.
spring.config.import=optional:file:./secrets.properties

# Google Programmable Search Engine (Custom Search JSON API)
# Create a free key at https://programmablesearchengine.google.com/ and
# https://console.cloud.google.com/apis/credentials, then set these as
# environment variables (do not commit real values):
#   GOOGLE_API_KEY=...
#   GOOGLE_CSE_ID=...
google.search.api-key=${GOOGLE_API_KEY:}
google.search.cse-id=${GOOGLE_CSE_ID:}

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:4200}
