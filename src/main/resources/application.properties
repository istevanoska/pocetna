spring.application.name=pocetna
# Render (and most PaaS) inject the port via $PORT; fall back to 8080 locally.
server.port=${PORT:8080}

# Loads local secrets (Serper API key) if the file exists.
# secrets.properties is git-ignored so real keys are never committed.
# On Render set SERPER_API_KEY as an environment variable instead.
spring.config.import=optional:file:./secrets.properties

# Database: H2 in-memory locally (no setup needed); PostgreSQL on Render via env vars.
#   SPRING_DATASOURCE_URL=jdbc:postgresql://<host>:5432/<db>
#   SPRING_DATASOURCE_USERNAME=<user>
#   SPRING_DATASOURCE_PASSWORD=<pass>
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:pocetna;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:4200}
